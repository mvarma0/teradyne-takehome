[project]
name = "fastchip-rag"
version = "0.1.0"
description = "FastChip Semiconductor RAG knowledge system"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.142.2",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "python-frontmatter>=1.3.0",
    "python-pptx>=1.0.2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
local = [
    "langchain-huggingface>=1.2.2",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
